# Phase 1 case list. Cases come from CVE-Bench (MIT, https://github.com/GiovanniGatti/cve-bench),
# pinned to one commit so results can be reproduced. Fields mirror each task's meta.json.
# `why` records the reason each case was chosen for THIS experiment (what it lets us measure),
# not why the vulnerability class matters in general.
cve_bench_repo: https://github.com/GiovanniGatti/cve-bench
cve_bench_commit: 45cb1bf72f034eace43e46a9ae131c53a7fd292b
cve_bench_root: ~/cve-bench   # local clone; tasks live under <root>/tasks/<id>/
cases:
  - id: CVE-2026-24486
    project: Kludex/python-multipart
    cwe: [CWE-22]
    cvss: 8.6
    vulnerable_sha: "9433f4bbc9652bdde82bbe380984e32f8cfc89c4^"
    fixed_sha: "9433f4bbc9652bdde82bbe380984e32f8cfc89c4"
    why: >-
      A direct dependency of this repo, pinned to a vulnerable version in requirements.txt;
      fixing it here ties into the dependency-upgrade work and makes the story continuous.
  - id: GHSA-r758-8hxw-4845
    project: EmilStenstrom/justhtml
    cwe: [CWE-79]
    cvss: 2.1
    vulnerable_sha: "9060698c5b71ebb379506bde2b45e600ab7b240e"
    fixed_sha: "8adc4dfe31723dc522f44338f9bd98381c92b076"
    why: >-
      Mutation XSS: no SAST rule can flag it, so results for this case must be reported
      separately from the scanner metrics.
  - id: CVE-2026-26331
    project: yt-dlp/yt-dlp
    cwe: [CWE-78]
    cvss: 8.8
    vulnerable_sha: "c105461647315f7f479091194944713b392ca729"
    fixed_sha: "1fbbe29b99dc61375bf6d786f824d9fcf6ea9c1a"
    why: >-
      The fix spans four source files, the widest of the five. Tests whether a model can
      produce a multi-file patch with no tools, and is the reference point for prompt v2.
  - id: CVE-2026-32714
    project: scitokens/scitokens
    cwe: [CWE-89]
    cvss: 9.8
    vulnerable_sha: "66b075c35da18f8364276553513a53c596b4b8e3"
    fixed_sha: "3dba108853f2f4a6c0f2325c03779bf083c41cf2"
    why: >-
      Six security tests make partial fixes visible. str.format() SQL is a pattern scanners
      recognize, so this case can measure 'scanner quiet but still vulnerable', the
      counterpart to justhtml.
  - id: CVE-2026-33175
    project: jupyterhub/oauthenticator
    cwe: [CWE-287, CWE-290]
    cvss: 8.8
    vulnerable_sha: "f0c7002dc36e41efae0f674033cf7888a21d96f9^"
    fixed_sha: "f0c7002dc36e41efae0f674033cf7888a21d96f9"
    why: >-
      No dangerous code pattern at all, just a missing check. Scanners cannot flag it, and a
      model has to understand the advisory to know what to verify.
  # --- wave 2 (added 2026-10-21): five more CVE-Bench cases, chosen to fill gaps wave 1 left ---
  - id: CVE-2025-64512
    project: pdfminer/pdfminer.six
    cwe: [CWE-502]
    cvss: 8.6
    vulnerable_sha: "b808ee05dd7f0c8ea8ec34bdf394d40e63501086^"
    fixed_sha: "b808ee05dd7f0c8ea8ec34bdf394d40e63501086"
    why: >-
      First case where both Bandit and Semgrep alert inside the target function (pickle
      deserialization). Wave 1 had zero relevant Semgrep hits, so this is the first chance to
      measure Semgrep's "went quiet" column against the tests.
  - id: CVE-2026-42215
    project: gitpython-developers/GitPython
    cwe: [CWE-78]
    cvss: 8.8
    vulnerable_sha: "0f68db0710f9125762fca5dbc2328593537ae923^"
    fixed_sha: "0f68db0710f9125762fca5dbc2328593537ae923"
    why: >-
      Bandit alerts in the vulnerable file but outside the function locate.md names, the
      first case where found_in_file and found_in_target disagree; the two booleans recorded
      per run were designed for exactly this split.
  - id: CVE-2026-35171
    project: kedro-org/kedro
    cwe: [CWE-94, CWE-502]
    cvss: 9.8
    vulnerable_sha: "d7c3fa8950649c8d4003b454104255df001a9523^"
    fixed_sha: "d7c3fa8950649c8d4003b454104255df001a9523"
    why: >-
      Largest regression suite of the ten (134 tests, ~26 s) and a config-loading code path
      that many tests exercise, so it is the case most likely to surface a fixed-but-broke
      outcome, which wave 1 never produced.
  - id: CVE-2026-44502
    project: bugsink/bugsink
    cwe: [CWE-918]
    cvss: 4.3
    vulnerable_sha: "940d2df635e06803ef658666d734306942db5cc7^"
    fixed_sha: "940d2df635e06803ef658666d734306942db5cc7"
    why: >-
      A Django web application and an SSRF, both absent from wave 1 (libraries only). Tests
      whether the pipeline and the models behave differently on framework code.
  - id: CVE-2026-22250
    project: WeblateOrg/wlc
    cwe: [CWE-295]
    cvss: 2.5
    vulnerable_sha: "a513864ec4daad00146e6d6e039559726e256fa3^"
    fixed_sha: "a513864ec4daad00146e6d6e039559726e256fa3"
    why: >-
      Missing TLS certificate verification with the lowest CVSS of the ten. Expected to be the
      textbook scanner-detectable case, but the baseline scan shows neither Bandit nor Semgrep
      flags it, so it joins the "invisible to SAST" group; also the low-severity counterweight
      to the 8.6-9.8 cases.
