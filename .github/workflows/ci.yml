name: CI

# Every job here blocks the PR when it fails. Nothing is `|| true`.
# Scope (ARCHITECTURE §9): CI checks the harness and the app as CODE. It never runs
# a CVE-Bench case or calls a model: that would execute third-party code and spend
# the Gateway budget on every push. Experiments run on the author's machine only.
#
# Actions are pinned to commit SHAs, not tags (a tag can be moved to malicious code;
# a SHA cannot). Dependabot (.github/dependabot.yml) proposes the bumps.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: pytest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      # Unit tests only: fake scripts, fake model client, no network, no budget.
      - run: python -m pytest -q -p no:warnings

  security:
    name: bandit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      # Medium severity and above fails the build. Low findings are reported, not gating.
      - run: bandit -r app/ harness/ main.py -ll

  semgrep:
    name: semgrep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      # Semgrep is installed on its own: its dependencies conflict with the app's pinned
      # starlette (decision log 2026-10-19), so it never goes into requirements*.txt.
      - run: pip install semgrep==1.181.0
      # The same community rule sets the harness records on every patch (harness/scan.py).
      # --error: any finding fails the build.
      - run: semgrep --config p/python --config p/security-audit --config p/owasp-top-ten --metrics=off --error app/ harness/ main.py

  secrets:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # scan the whole history, not just the last commit
      # Fails on any committed secret (keys, tokens). .env is gitignored; this catches
      # the day that stops being true.
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependencies:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      # Any known vulnerability in a pinned dependency fails the build (OWASP A06).
      - run: pip-audit -r requirements.txt -r requirements-dev.txt --progress-spinner off
